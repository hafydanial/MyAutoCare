<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>My Vehicles — MyAutoCare</title>
<link rel="stylesheet" href="app.css"/>
</head>
<body>
<div id="toast-container"></div>
<div class="app-layout"></div>

<div class="modal-overlay" id="vehicleModal">
  <div class="modal">
    <div class="modal-header">
      <span class="modal-title" id="modalTitle">Add Vehicle</span>
      <button class="modal-close" onclick="window.closeModal()">×</button>
    </div>
    <input type="hidden" id="editId"/>
    <div class="form-row">
      <div class="form-group">
        <label class="form-label">Vehicle Type *</label>
        <select id="vType" class="form-select">
          <option value="car">🚗 Car</option>
          <option value="motorcycle">🏍️ Motorcycle</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">Plate Number *</label>
        <input type="text" id="vPlate" class="form-control" placeholder="WXX 1234" style="text-transform:uppercase"/>
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label class="form-label">Brand *</label>
        <input type="text" id="vBrand" class="form-control" placeholder="Perodua, Honda..."/>
      </div>
      <div class="form-group">
        <label class="form-label">Model *</label>
        <input type="text" id="vModel" class="form-control" placeholder="Myvi, Civic..."/>
      </div>
    </div>
    <div class="form-row-3">
      <div class="form-group">
        <label class="form-label">Year</label>
        <input type="number" id="vYear" class="form-control" placeholder="2021"/>
      </div>
      <div class="form-group">
        <label class="form-label">Colour</label>
        <input type="text" id="vColour" class="form-control" placeholder="Silver"/>
      </div>
      <div class="form-group">
        <label class="form-label">Fuel Type</label>
        <select id="vFuel" class="form-select">
          <option>Petrol</option><option>Diesel</option><option>EV</option><option>Hybrid</option>
        </select>
      </div>
    </div>
    <div class="form-group">
      <label class="form-label">Current Mileage (km)</label>
      <input type="number" id="vMileage" class="form-control" placeholder="45000"/>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="window.closeModal()">Cancel</button>
      <button class="btn btn-primary" id="saveVehicleBtn" onclick="window.saveVehicle()">Save Vehicle</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="deleteModal">
  <div class="modal" style="max-width:400px">
    <div class="modal-header">
      <span class="modal-title">Delete Vehicle?</span>
      <button class="modal-close" onclick="document.getElementById('deleteModal').classList.remove('open')">×</button>
    </div>
    <p style="color:var(--muted);font-size:.9rem">This will permanently delete the vehicle and <strong style="color:var(--danger)">all its maintenance logs and reminders</strong>.</p>
    <input type="hidden" id="deleteId"/>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="document.getElementById('deleteModal').classList.remove('open')">Cancel</button>
      <button class="btn btn-danger" id="confirmDeleteBtn" onclick="window.confirmDelete()">Yes, Delete</button>
    </div>
  </div>
</div>

<script type="module">
import MAC from './app-core.js';
import { buildLayout } from './layout.js';
(async () => {

const user = await buildLayout('vehicles', 'My Vehicles');

// ── Render ─────────────────────────────────────────────
async function renderPage() {
  const pc = document.getElementById('page-content');
  pc.innerHTML = `<div style="padding:3rem;text-align:center;color:var(--muted)">
    <div style="font-size:2rem;margin-bottom:.5rem">⏳</div>Loading vehicles...</div>`;

  let vehicles = [], logs = [];
  try {
    // Fetch vehicles and all logs in parallel
    [vehicles, logs] = await Promise.all([
      MAC.vehicles.forUser(user.uid),
      MAC.logs.forUser(user.uid)
    ]);
  } catch(e) {
    console.error('Load error:', e);
    pc.innerHTML = `<div class="empty-state">
      <div class="empty-icon">⚠️</div>
      <div class="empty-title">Could not load vehicles</div>
      <div class="empty-desc">${e.message}</div>
      <button class="btn btn-primary" style="margin-top:1rem" onclick="window.renderPage()">Try Again</button>
    </div>`;
    return;
  }

  // Build log map by vehicleId for fast lookup — no extra Firestore calls
  const logsByVehicle = {};
  logs.forEach(l => {
    if (!logsByVehicle[l.vehicleId]) logsByVehicle[l.vehicleId] = [];
    logsByVehicle[l.vehicleId].push(l);
  });

  function getStatus(vehicleId) {
    const vLogs = logsByVehicle[vehicleId] || [];
    if (!vLogs.length) return { label:'No Records', cls:'status-none' };
    const sorted = [...vLogs].sort((a,b) => (b.serviceDate||'').localeCompare(a.serviceDate||''));
    const days = (Date.now() - new Date(sorted[0].serviceDate)) / 86400000;
    if (days > 180) return { label:'Overdue',  cls:'status-overdue' };
    if (days > 150) return { label:'Due Soon', cls:'status-soon' };
    return { label:'Good', cls:'status-good' };
  }

  const cards = vehicles.map(v => {
    const s    = getStatus(v.id);
    const vLog = logsByVehicle[v.id] || [];
    const last = [...vLog].sort((a,b) => (b.serviceDate||'').localeCompare(a.serviceDate||''))[0];
    return `<div class="vehicle-card">
      <div style="display:flex;align-items:flex-start;justify-content:space-between">
        <div class="vehicle-card-type">${v.type==='car'?'🚗':'🏍️'}</div>
        <span class="badge badge-${s.cls.replace('status-','')}">${s.label}</span>
      </div>
      <div class="vehicle-name">${MAC.utils.escapeHtml(v.brand)} ${MAC.utils.escapeHtml(v.model)}</div>
      <div class="vehicle-plate">${MAC.utils.escapeHtml(v.plate)}</div>
      <div class="vehicle-meta">${v.year||'—'} · ${v.colour||'—'} · ${v.fuelType||'—'} · ${v.mileage?parseInt(v.mileage).toLocaleString()+' km':'—'}</div>
      <div style="margin-top:.5rem;font-size:.78rem;color:var(--muted)">
        ${last ? `Last service: ${MAC.utils.formatDate(last.serviceDate)}` : 'No service records'}
        · ${vLog.length} record${vLog.length!==1?'s':''}
      </div>
      <div class="vehicle-actions">
        <button class="btn btn-outline btn-sm" onclick="window.openEditModal('${v.id}')">Edit</button>
        <button class="btn btn-danger btn-sm" onclick="window.openDeleteModal('${v.id}')">Delete</button>
        <a href="maintenance.html?vehicle=${v.id}" class="btn btn-outline btn-sm">View Logs</a>
      </div>
    </div>`;
  });

  pc.innerHTML = `
    <div class="page-header">
      <div>
        <h1 class="page-title">My Vehicles</h1>
        <p class="page-subtitle">${vehicles.length} vehicle${vehicles.length!==1?'s':''} registered</p>
      </div>
      <button class="btn btn-primary" onclick="window.openAddModal()">
        <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" width="15" height="15"><path stroke-linecap="round" d="M12 4.5v15m7.5-7.5h-15"/></svg>
        Add Vehicle
      </button>
    </div>
    ${vehicles.length === 0
      ? `<div class="empty-state">
           <div class="empty-icon">🚗</div>
           <div class="empty-title">No vehicles yet</div>
           <div class="empty-desc">Add your first vehicle to start tracking maintenance</div>
           <button class="btn btn-primary" style="margin-top:1rem" onclick="window.openAddModal()">Add My First Vehicle</button>
         </div>`
      : `<div class="vehicle-grid">${cards.join('')}</div>`
    }`;
}

// ── Modal functions ────────────────────────────────────
window.openAddModal = function() {
  document.getElementById('modalTitle').textContent = 'Add Vehicle';
  document.getElementById('editId').value = '';
  ['vPlate','vBrand','vModel','vYear','vColour','vMileage'].forEach(id => document.getElementById(id).value = '');
  document.getElementById('vType').value = 'car';
  document.getElementById('vFuel').value = 'Petrol';
  document.getElementById('vehicleModal').classList.add('open');
};

window.openEditModal = async function(id) {
  try {
    const v = await MAC.vehicles.get(id);
    if (!v) { MAC.utils.toast('Vehicle not found','error'); return; }
    document.getElementById('modalTitle').textContent = 'Edit Vehicle';
    document.getElementById('editId').value    = id;
    document.getElementById('vType').value     = v.type    || 'car';
    document.getElementById('vPlate').value    = v.plate   || '';
    document.getElementById('vBrand').value    = v.brand   || '';
    document.getElementById('vModel').value    = v.model   || '';
    document.getElementById('vYear').value     = v.year    || '';
    document.getElementById('vColour').value   = v.colour  || '';
    document.getElementById('vFuel').value     = v.fuelType|| 'Petrol';
    document.getElementById('vMileage').value  = v.mileage || '';
    document.getElementById('vehicleModal').classList.add('open');
  } catch(e) { MAC.utils.toast('Could not load vehicle: ' + e.message,'error'); }
};

window.closeModal = function() {
  document.getElementById('vehicleModal').classList.remove('open');
};

window.saveVehicle = async function() {
  const data = {
    type:     document.getElementById('vType').value,
    plate:    document.getElementById('vPlate').value.trim().toUpperCase(),
    brand:    document.getElementById('vBrand').value.trim(),
    model:    document.getElementById('vModel').value.trim(),
    year:     document.getElementById('vYear').value,
    colour:   document.getElementById('vColour').value.trim(),
    fuelType: document.getElementById('vFuel').value,
    mileage:  document.getElementById('vMileage').value,
  };
  if (!data.plate || !data.brand || !data.model) {
    MAC.utils.toast('Please fill in Plate, Brand and Model','error'); return;
  }
  const btn = document.getElementById('saveVehicleBtn');
  btn.textContent = 'Saving…'; btn.disabled = true;
  try {
    const editId = document.getElementById('editId').value;
    if (editId) {
      await MAC.vehicles.update(editId, data);
      MAC.utils.toast('Vehicle updated ✓');
    } else {
      await MAC.vehicles.create(data);
      MAC.utils.toast('Vehicle added ✓');
    }
    window.closeModal();
    await renderPage();
  } catch(e) {
    console.error('Save vehicle error:', e.code, e.message);
    MAC.utils.toast('Save failed: ' + e.message, 'error');
  } finally {
    btn.textContent = 'Save Vehicle'; btn.disabled = false;
  }
};

window.openDeleteModal = function(id) {
  document.getElementById('deleteId').value = id;
  document.getElementById('deleteModal').classList.add('open');
};

window.confirmDelete = async function() {
  const id  = document.getElementById('deleteId').value;
  const btn = document.getElementById('confirmDeleteBtn');
  btn.textContent = 'Deleting…'; btn.disabled = true;
  try {
    await MAC.vehicles.delete(id);
    document.getElementById('deleteModal').classList.remove('open');
    MAC.utils.toast('Vehicle deleted');
    await renderPage();
  } catch(e) {
    console.error('Delete error:', e.code, e.message);
    MAC.utils.toast('Delete failed: ' + e.message,'error');
  } finally {
    btn.textContent = 'Yes, Delete'; btn.disabled = false;
  }
};

window.renderPage = renderPage;

// Initial load
await renderPage();
})();
</script>
</body>
</html>
