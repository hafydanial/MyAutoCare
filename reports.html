<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Reports & Share — MyAutoCare</title>
<link rel="stylesheet" href="app.css"/>
<style>
.rp-table{width:100%;border-collapse:collapse;font-size:.8rem;margin-top:.75rem}
.rp-table th{background:#0f1a0e;color:#d3f7e1;padding:.5rem;text-align:left}
.rp-table td{padding:.5rem;border-bottom:1px solid #e5e7eb}
.rp-table tr:nth-child(even) td{background:#f9fafb}
.share-box{background:var(--stone);border:1px solid var(--line);border-radius:var(--r-sm);padding:.75rem 1rem;display:flex;align-items:center;gap:.75rem}
.share-box input{flex:1;background:none;border:none;color:var(--accent);font-size:.85rem;outline:none;font-family:var(--sans)}
</style>
</head>
<body>
<div id="toast-container"></div>
<div class="app-layout"></div>
<script type="module">
import MAC from './app-core.js';
import { buildLayout } from './layout.js';
(async () => {

const user = await buildLayout('reports', 'Reports & Share');

document.getElementById('page-content').innerHTML =
  `<div style="padding:3rem;text-align:center;color:var(--muted)"><div style="font-size:2rem;margin-bottom:.5rem">⏳</div>Loading...</div>`;

// Load all data upfront
let vehicles = [], allLogs = [];
try {
  [vehicles, allLogs] = await Promise.all([
    MAC.vehicles.forUser(user.uid),
    MAC.logs.forUser(user.uid)
  ]);
} catch(e) {
  document.getElementById('page-content').innerHTML =
    `<div class="empty-state"><div class="empty-icon">⚠️</div><div class="empty-title">Could not load data</div><div class="empty-desc">${e.message}</div></div>`;
  return;
}

let selectedId = vehicles.length ? vehicles[0].id : null;

// Share links stored in localStorage (token stored in Firestore)
let shareLinks = JSON.parse(localStorage.getItem('mac_sharelinks_'+user.uid) || '{}');
function saveLinks() { localStorage.setItem('mac_sharelinks_'+user.uid, JSON.stringify(shareLinks)); }

function renderPage() {
  const v    = vehicles.find(v => v.id === selectedId);
  const logs = v ? allLogs.filter(l => l.vehicleId===v.id || l.vehicleId==v.id)
                          .sort((a,b) => (b.serviceDate||'').localeCompare(a.serviceDate||'')) : [];
  const totalCost = logs.reduce((s,l) => s + parseFloat(l.cost||0), 0);
  const link = selectedId ? shareLinks[selectedId] : null;
  const shareUrl = link ? `${location.origin}${location.pathname.replace('reports.html','')}public-report.html?token=${link.token}` : '';

  document.getElementById('page-content').innerHTML = `
    <div class="page-header">
      <div><h1 class="page-title">Reports & Share</h1>
      <p class="page-subtitle">Generate reports and share vehicle history with buyers</p></div>
    </div>
    <div style="display:grid;grid-template-columns:1fr 2fr;gap:1.25rem;align-items:start" class="reports-grid">

      <!-- Left panel -->
      <div style="display:flex;flex-direction:column;gap:1rem">
        <div class="card">
          <div class="card-title" style="margin-bottom:1rem">Select Vehicle</div>
          ${vehicles.length
            ? vehicles.map(veh => `
              <div onclick="window._selectVehicle('${veh.id}')"
                style="display:flex;align-items:center;gap:.75rem;padding:.75rem;border-radius:var(--r-sm);cursor:pointer;
                       border:1px solid ${veh.id===selectedId?'var(--accent)':'var(--line)'};
                       background:${veh.id===selectedId?'var(--accent-dim)':'transparent'};
                       margin-bottom:.5rem;transition:all .2s">
                <div style="font-size:1.3rem">${veh.type==='car'?'🚗':'🏍️'}</div>
                <div>
                  <div style="font-weight:600;color:var(--heading);font-size:.9rem">${MAC.utils.escapeHtml(veh.brand+' '+veh.model)}</div>
                  <div style="font-size:.75rem;color:var(--accent)">${MAC.utils.escapeHtml(veh.plate)}</div>
                </div>
              </div>`).join('')
            : `<div style="color:var(--muted);font-size:.875rem">No vehicles yet. <a href="vehicles.html" style="color:var(--accent)">Add one →</a></div>`
          }
        </div>

        ${v ? `
        <div class="card">
          <div class="card-title" style="margin-bottom:1rem">🔗 Share with Buyer</div>
          ${link
            ? `<div class="share-box" style="margin-bottom:.75rem">
                 <input type="text" value="${shareUrl}" readonly id="shareInput"/>
                 <button class="btn btn-outline btn-sm" onclick="window.copyLink()">Copy</button>
               </div>
               <div style="font-size:.75rem;color:var(--muted);margin-bottom:.75rem">Expires: ${MAC.utils.formatDate(link.expiresAt)}</div>
               <button class="btn btn-danger btn-sm" style="width:100%;justify-content:center" onclick="window.revokeLink('${v.id}')">Revoke Link</button>`
            : `<p style="font-size:.85rem;color:var(--muted);margin-bottom:1rem">Generate a secure link for buyers to view this vehicle's full maintenance history — no login needed.</p>
               <button class="btn btn-primary" style="width:100%;justify-content:center" id="genBtn" onclick="window.generateLink('${v.id}')">
                 Generate Share Link
               </button>`
          }
        </div>
        <button class="btn btn-outline" style="width:100%;justify-content:center" onclick="window.printReport()">
          <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" width="15" height="15"><path stroke-linecap="round" d="M6.72 13.829c-.24.03-.48.062-.72.096m.72-.096a42.415 42.415 0 0 1 10.56 0m-10.56 0L6.34 18m10.94-4.171c.24.03.48.062.72.096m-.72-.096L17.66 18m0 0 .229 2.523a1.125 1.125 0 0 1-1.12 1.227H7.231c-.662 0-1.18-.568-1.12-1.227L6.34 18m11.318 0h1.091A2.25 2.25 0 0 0 21 15.75V9.456c0-1.081-.768-2.015-1.837-2.175a48.055 48.055 0 0 0-1.913-.247M6.34 18H5.25A2.25 2.25 0 0 1 3 15.75V9.456c0-1.081.768-2.015 1.837-2.175a48.041 48.041 0 0 1 1.913-.247m10.5 0a48.536 48.536 0 0 0-10.5 0m10.5 0V3.375c0-.621-.504-1.125-1.125-1.125h-8.25c-.621 0-1.125.504-1.125 1.125v3.659M18 10.5h.008v.008H18V10.5Zm-3 0h.008v.008H15V10.5Z"/></svg>
          Print / Save PDF
        </button>
        ` : ''}
      </div>

      <!-- Report preview -->
      <div class="card" id="reportPreview">
        ${!v
          ? `<div class="empty-state"><div class="empty-icon">📄</div><div class="empty-title">Select a vehicle</div><div class="empty-desc">Choose a vehicle to preview its report</div></div>`
          : `<div class="card-header">
               <div class="card-title">Report Preview</div>
               <span style="font-size:.75rem;color:var(--muted)">Generated ${new Date().toLocaleDateString('en-MY')}</span>
             </div>
             <div id="printable" style="background:white;color:#111;border-radius:var(--r);padding:1.5rem;margin-top:1rem">
               <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:1.5rem">
                 <div>
                   <div style="font-family:var(--sans);font-weight:900;font-size:1.4rem;color:#0f1a0e">MyAutoCare</div>
                   <div style="font-size:.75rem;color:#6b7280">Smart Vehicle Maintenance System</div>
                 </div>
                 <div style="background:#1db954;color:#fff;font-weight:800;padding:.3rem .8rem;border-radius:6px;font-size:.8rem">✓ VERIFIED</div>
               </div>
               <h2 style="font-size:1.1rem;font-weight:800;color:#0f1a0e;border-bottom:3px solid #1db954;padding-bottom:.5rem;margin-bottom:1rem">Vehicle Maintenance Report</h2>
               <div style="display:grid;grid-template-columns:1fr 1fr;gap:.5rem;margin-bottom:1.25rem;font-size:.85rem">
                 <div><span style="color:#6b7280">Vehicle:</span> <strong>${MAC.utils.escapeHtml(v.brand+' '+v.model)}</strong></div>
                 <div><span style="color:#6b7280">Plate:</span> <strong style="color:#1db954">${MAC.utils.escapeHtml(v.plate)}</strong></div>
                 <div><span style="color:#6b7280">Year:</span> ${v.year||'—'}</div>
                 <div><span style="color:#6b7280">Colour:</span> ${v.colour||'—'}</div>
                 <div><span style="color:#6b7280">Fuel:</span> ${v.fuelType||'—'}</div>
                 <div><span style="color:#6b7280">Mileage:</span> ${v.mileage?parseInt(v.mileage).toLocaleString()+' km':'—'}</div>
               </div>
               <h3 style="font-weight:800;margin-bottom:.5rem;color:#0f1a0e;font-size:.95rem">Service History (${logs.length} records)</h3>
               ${logs.length
                 ? `<table class="rp-table">
                      <thead><tr><th>Date</th><th>Service</th><th>Mileage</th><th>Workshop</th><th>Cost (RM)</th></tr></thead>
                      <tbody>
                        ${logs.map(l=>`<tr>
                          <td>${MAC.utils.formatDate(l.serviceDate)}</td>
                          <td>${MAC.utils.escapeHtml(l.serviceType)}</td>
                          <td>${l.mileageAtService?parseInt(l.mileageAtService).toLocaleString()+' km':'—'}</td>
                          <td>${MAC.utils.escapeHtml(l.workshopName)}</td>
                          <td><strong>${parseFloat(l.cost||0).toFixed(2)}</strong></td>
                        </tr>`).join('')}
                        <tr style="background:#edfbf2">
                          <td colspan="4"><strong>Total Maintenance Cost</strong></td>
                          <td><strong style="color:#1db954">RM ${totalCost.toFixed(2)}</strong></td>
                        </tr>
                      </tbody>
                    </table>`
                 : '<p style="color:#6b7280;font-size:.85rem">No service records for this vehicle.</p>'
               }
               <div style="margin-top:1.5rem;padding-top:1rem;border-top:1px solid #e5e7eb;font-size:.72rem;color:#9ca3af;display:flex;justify-content:space-between">
                 <span>Report ID: MAC-${Date.now().toString(36).toUpperCase()}</span>
                 <span>Generated: ${new Date().toLocaleString('en-MY')}</span>
               </div>
             </div>`
        }
      </div>
    </div>`;

  if (window.innerWidth <= 700) {
    document.querySelector('.reports-grid')?.style.setProperty('grid-template-columns','1fr');
  }
}

// ── Functions ──────────────────────────────────────────
window._selectVehicle = function(id) {
  selectedId = id;
  renderPage();
};

window.generateLink = async function(vehicleId) {
  const btn = document.getElementById('genBtn');
  if (btn) { btn.textContent = 'Generating…'; btn.disabled = true; }
  try {
    const token   = await MAC.tokens.create(vehicleId);
    const expires = new Date(); expires.setDate(expires.getDate() + 30);
    shareLinks[vehicleId] = { token, expiresAt: expires.toISOString() };
    saveLinks();
    MAC.utils.toast('Share link generated! Valid for 30 days.');
    renderPage();
  } catch(e) {
    MAC.utils.toast('Failed to generate link: ' + e.message, 'error');
    if (btn) { btn.textContent = 'Generate Share Link'; btn.disabled = false; }
  }
};

window.revokeLink = function(vehicleId) {
  delete shareLinks[vehicleId];
  saveLinks();
  MAC.utils.toast('Share link revoked');
  renderPage();
};

window.copyLink = function() {
  const input = document.getElementById('shareInput');
  if (!input) return;
  navigator.clipboard.writeText(input.value)
    .then(() => MAC.utils.toast('Link copied!'))
    .catch(() => { input.select(); document.execCommand('copy'); MAC.utils.toast('Link copied!'); });
};

window.printReport = function() {
  const el = document.getElementById('printable');
  if (!el) { MAC.utils.toast('Select a vehicle first','error'); return; }
  const win = window.open('', '_blank');
  win.document.write(`<!DOCTYPE html><html><head><title>MyAutoCare Report</title>
    <style>body{font-family:system-ui,sans-serif;padding:2rem;max-width:800px;margin:0 auto}
    .rp-table{width:100%;border-collapse:collapse}.rp-table th{background:#0f1a0e;color:#d3f7e1;padding:.5rem;text-align:left}
    .rp-table td{padding:.5rem;border-bottom:1px solid #e5e7eb}</style>
  </head><body>${el.outerHTML}<script>window.print();<\/script></body></html>`);
  win.document.close();
};

window.renderPage = renderPage;
renderPage();
})();
</script>
</body>
</html>
